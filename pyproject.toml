[project]
name = "conflens"
version = "0.1.14"
description = "Browse, theme-classify, and topic-model conference papers with a NiceGUI UI."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MPL-2.0" }
authors = [
    { name = "Jérôme Picault", email = "jerome.picault@rte-france.com" },
]
maintainers = [
    { name = "Jérôme Picault", email = "jerome.picault@rte-france.com" },
]
keywords = ["topics", "conferences", "LLM", "topic analysis", "report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "nicegui>=2.0",
    "anthropic>=0.40",
    "openai>=1.40",
    "litellm>=1.40",
    "python-pptx>=0.6.21",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Optional embedding-based topic backend. Heavy (pulls in sentence-transformers
# / torch); install with `uv sync --extra bertopic`.
bertopic = ["bertopic>=0.16"]

[project.scripts]
conflens = "conflens.cli:main"
conference-analyzer = "conflens.cli:main"  # backward-compatible alias

[project.urls]
homepage = "https://github.com/picaultj/conflens"
repository = "https://github.com/picaultj/conflens"


[dependency-groups]
# Installed by default with `uv sync`; used for tests + linting / CI.
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conflens"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E402: llm.py/cli.py intentionally import lazily inside functions; E501: a few
# long f-strings/regex lines read better whole.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
